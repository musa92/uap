name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install 'jsonschema>=4.20' 'referencing>=0.35' pytest
      - name: Schemas, refs, invariants, conformance vectors
        run: make schemas
      - name: Reference implementation tests
        run: make unit
      - name: End-to-end demo
        run: make demo

  no-dependency-check:
    # The reference implementation must run on the standard library alone, so
    # that it can be vendored into a serving node without a dependency tree.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Demo runs with no third-party packages installed
        run: python3 reference/python/demo/end_to_end.py
